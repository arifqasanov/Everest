<style>
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--bg:#050b1a;--ice:#eaf6ff;--cy:#5ef0ff;--vi:#7a6bff;--gold:#ffc857;--mut:#c4d6ea}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ice);font-family:"Segoe UI Variable","Segoe UI",Inter,system-ui,sans-serif}
.aur i{position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(100px);opacity:.33;animation:drift 20s ease-in-out infinite alternate}
.aur i:nth-child(1){background:#00d9b5;left:-20vmax;top:-25vmax}
.aur i:nth-child(2){background:#6a5cff;right:-20vmax;top:5vmax;animation-delay:-7s}
.aur i:nth-child(3){background:#1597ff;left:20vmax;bottom:-35vmax;animation-delay:-12s}
@keyframes drift{to{transform:translate(8vmax,6vmax) rotate(40deg) scale(1.15)}}
.glow{position:fixed;left:0;top:0;width:560px;height:560px;border-radius:50%;background:radial-gradient(#5ef0ff26,transparent 62%);pointer-events:none;transform:translate(calc(var(--x,50vw) - 50%),calc(var(--y,50vh) - 50%));z-index:2}
#snow{position:fixed;inset:0;pointer-events:none;z-index:3}
#bar{position:fixed;left:0;top:0;height:5px;width:0;background:linear-gradient(90deg,var(--cy),var(--vi),var(--gold));z-index:10;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.deck{position:fixed;inset:0;perspective:1600px;z-index:1}
.slide{position:absolute;inset:4vh 4vw 11vh;display:flex;flex-direction:column;justify-content:center;opacity:0;pointer-events:none;transform:translateZ(-500px) rotateY(50deg) scale(.85);filter:blur(16px);transition:transform 1s cubic-bezier(.2,.8,.2,1),opacity .7s,filter .8s;overflow:auto;padding:1vh;scrollbar-width:none}

.wrap{display:flex;flex-direction:column;gap:2vh}
.wrap.c{align-items:flex-start}
h1{font-size:clamp(2.8rem,7.5vw,6.8rem);line-height:1.02;font-weight:800;letter-spacing:-.02em;text-shadow:0 10px 50px #5ef0ff55}
h2{font-size:clamp(2.2rem,5vw,4.4rem);font-weight:800;letter-spacing:-.01em;line-height:1.1}
p{font-size:clamp(1.4rem,2.6vw,2.3rem);line-height:1.5;color:#e3f0fc;max-width:62ch}

@keyframes sh{to{background-position:250% 0}}
.big{font-size:clamp(3rem,10vw,8rem)}
.chip{display:inline-block;padding:8px 20px;border-radius:30px;border:1px solid #5ef0ff66;background:#5ef0ff14;color:var(--cy);font-size:clamp(1.3rem,2.4vw,2rem);backdrop-filter:blur(8px)}
.who{padding:14px 24px;border-radius:16px;background:#ffffff10;border:1px solid #ffffff2a;backdrop-filter:blur(10px);font-size:clamp(1.5rem,3vw,2.5rem)}

.bento{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.4vw}
.card{position:relative;padding:20px 22px;border-radius:22px;background:linear-gradient(145deg,#ffffff14,#ffffff05);backdrop-filter:blur(14px);box-shadow:0 24px 50px #0009;transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s}

.on .draw{animation:dr 2.2s .5s forwards ease-out}
@keyframes dr{to{stroke-dashoffset:0}}
.pulse{animation:pl 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{50%{transform:scale(1.9);opacity:.3}}
.two{display:flex;gap:3vw;align-items:center}
.two>.v{flex:1.1}.two>.t{flex:1;display:flex;flex-direction:column;gap:1.6vh}
.v svg{width:100%;max-height:60vh;filter:drop-shadow(0 20px 30px #000a)}
.wave{animation:wv 5s linear infinite}
@keyframes wv{to{transform:translateX(-120px)}}
.ring2{fill:none;stroke:#ff7a45;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:rg 2.6s ease-out infinite}

@keyframes rg{from{transform:scale(.3);opacity:1}to{transform:scale(4);opacity:0}}
.lava{stroke-dasharray:8 10;animation:lv 1.2s linear infinite}
@keyframes lv{to{stroke-dashoffset:-36}}
.tl{position:relative}
.tl::before{content:"";position:absolute;left:4%;right:4%;top:48px;height:3px;background:linear-gradient(90deg,var(--cy),var(--gold));transform:scaleX(0);transform-origin:left;border-radius:3px}
.on .tl::before{animation:gr 2.4s .6s forwards cubic-bezier(.3,.7,.2,1)}
@keyframes gr{to{transform:scaleX(1)}}
.num{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:2px solid var(--gold);color:var(--gold);font-weight:800;font-size:1.6rem;margin-bottom:10px}
.climb{display:flex;gap:3vw;align-items:center;justify-content:center}
.climb .vis svg{height:67vh;width:auto;max-width:42vw;display:block;filter:drop-shadow(0 20px 40px #000c)}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1.4vh}
.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.alt{font-size:clamp(2.8rem,8vw,6rem)}
.g{width:clamp(100px,13vw,150px);flex:none}
.g .ring{fill:none;stroke:var(--c);stroke-width:8;stroke-linecap:round;stroke-dasharray:276.5;transform:rotate(-90deg);transform-origin:50% 50%}
.g small{display:block;text-align:center;font-size:1.2rem;color:var(--mut)}
.zt{align-self:flex-start;padding:7px 16px;border-radius:20px;border:1px solid var(--c);color:var(--c);font-size:clamp(1.3rem,2.4vw,2rem);background:#ffffff0a}
.halo{fill:none;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pl 1.5s infinite}
.hero{position:absolute;left:-5vw;right:-5vw;bottom:-11vh;height:62%;pointer-events:none;z-index:-1}
.hero svg{position:absolute;bottom:0;width:100%;height:100%}
.hero polygon{transform:translateY(450px)}
.on .hero polygon{animation:rise 1.8s var(--d) forwards cubic-bezier(.2,.8,.2,1)}
@keyframes rise{to{transform:none}}
nav{position:fixed;bottom:2.2vh;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;z-index:9}
nav button{width:60px;height:60px;border-radius:50%;border:1px solid #ffffff44;background:#ffffff14;backdrop-filter:blur(10px);color:var(--ice);font-size:2rem;cursor:pointer;transition:.2s}
nav button:hover{background:#ffffff30;transform:scale(1.1)}
nav button:focus-visible{outline:2px solid var(--gold)}
#cnt{min-width:110px;text-align:center;color:var(--mut);font-size:1.6rem;font-variant-numeric:tabular-nums}
@media(max-width:760px){.climb,.two{flex-direction:column}.climb .vis svg{height:32vh;max-width:90vw}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>

 $$('[data-count]',s).forEach(el=>{const v=+el.dataset.count,suf=el.dataset.suf||'';anim(2000,e=>el.textContent=(el.dataset.count==='2022'?Math.round(v*e):fmt(v*e))+suf,500)});

 $('#bar').style.width=((i+1)/N*100)+'%';$('#cnt').textContent=(i+1)+' / '+N;
}
